[project]
name = "agent-debugger-evals"
version = "0.1.0"
description = "A reproducible evaluation and debugging harness for coding agents."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "cursor-sdk>=1.0.27",
    "pyyaml>=6.0.3",
    "typer>=0.27.1",
]

[project.scripts]
agent-eval = "agent_debugger_evals.cli:app"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
